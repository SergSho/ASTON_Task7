version: '2.0'
services:
  db:

    image: postgres:14-alpine
    restart: always
    container_name: postgreSQL
#    environment:
#      POSTGRES_USER: postgresQL
#      POSTGRES_PASSWORD: postgresQL
#      POSTGRES_DB: users_DB
    ports:
      - "5432:5432"
    networks:
      - local-net

# Apache Kafka (Parameters are from DockerHub)
#  Run Kafka in KRaft (instead Zookeeper)
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://local-net:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - local-net


  # Email's consumer
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
# UI
      - "8025:8025"
      - "1025:1025"
    networks:
      - local-net

  config-server:
    container_name: config-server
    build:
      context: ./config-server
#  Don't need to specify it if the filename is standard.
      dockerfile: Dockerfile
#  Download configuration from git.
    ports:
      - "8888:8888"
    networks:
      - local-net

  eureka-server:
    container_name: eureka-server
    build:
      context: ./eureka-server
    depends_on:
      - config-server
    networks:
      - local-net
    ports:
      - "8761:8761"

  gateway:
    container_name: gateway
    build:
      context: ./gateway

    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    networks:
      - local-net

  consumer:
    container_name: consumer
    build:
      context: ./consumer
    depends_on:
      - kafka
      - eureka-server
      - mailhog
    networks:
      - local-net

  producer:
    container_name: producer
    build:
      context: ./springproject
    depends_on:
      - consumer
    networks:
      - local-net

networks:
  local-net:
    driver: bridge
