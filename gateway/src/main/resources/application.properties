spring.application.name=gateway

server.port = 8080

# Маршруты
spring.cloud.gateway.server.webflux.routes[0].id=springproject
spring.cloud.gateway.server.webflux.routes[0].uri=lb://springproject
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/users/**

#spring.cloud.gateway.server.webflux.routes[1].id=consumer
#spring.cloud.gateway.server.webflux.routes[1].uri=lb://consumer
#spring.cloud.gateway.server.webflux.routes[1].predicates=Path=/message/**

# для интеграции с "Эврикой"
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
